<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>おてせんベアのゲーム</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            background: linear-gradient(135deg, #FFFDF0 0%, #FFF4CC 100%);
            font-family: 'Hiragino Maru Gothic ProN', 'BIZ UDGothic', 'Yu Gothic', 'Meiryo', sans-serif;
            color: #5D4037;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 24px;
            padding: 24px;
        }
        h1 {
            font-size: 22px;
            font-weight: 900;
            margin: 0;
            text-align: center;
        }
        .games {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 340px;
        }
        a.game {
            display: block;
            text-decoration: none;
            color: #5D4037;
            background: #FFF;
            border: 3px solid #E8C476;
            border-radius: 22px;
            padding: 22px 18px;
            text-align: center;
            font-size: 19px;
            font-weight: 900;
            box-shadow: 0 8px 20px rgba(93, 64, 55, 0.10);
            transition: transform 0.15s;
        }
        a.game:active { transform: scale(0.96); }
        a.game .sub {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #8D6E63;
            margin-top: 6px;
        }
        .foot { font-size: 10px; color: #B79B84; }
    </style>
</head>
<body>
    <h1>🐻 おてせんベアのゲーム 🍯</h1>
    <div class="games">
        <a class="game" href="otesen-frontier.html">🌲 おてせんサバイバル<span class="sub">集めて、売って、村になる。採集・建設・自動化の開拓ゲーム</span></a>
        <a class="game" href="otesen-puyo.html">🧸 おてせんベアのぷ●ぷよ<span class="sub">4つつなげて消す おちものパズル</span></a>
        <a class="game" href="otesen-suika.html">🍉 おてせんベアのスイ●ゲーム<span class="sub">くっつけて大きくする 物理パズル</span></a>
        <a class="game" href="otesen-runner.html">🐻 おてせんベアのくまくまランナー<span class="sub">なかまをふやして てきをたおす 3Dランナー</span></a>
        <a class="game" href="otesen-survivor.html">🍘 やばやばサバイバー・おてせんば<span class="sub">むれをなぎはらえ! ヴァンサバふう 弾幕サバイバル</span></a>
    </div>
    <div class="foot">ブックマークしていつでも遊んでね</div>
</body>
</html>
